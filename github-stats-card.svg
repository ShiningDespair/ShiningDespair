<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195">
  <style>
    .h  { font: 600 17px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #58A6FF }
    .lb { font: 400 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #8B949E }
    .vl { font: 700 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #C9D1D9 }
    .rk { font: 700 20px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #FFD700 }
    .rs { font: 400 11px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #8B949E }
  </style>

  <!-- Card background + border -->
  <rect width="495" height="195" rx="4.5" fill="#0D1117"/>
  <rect x=".5" y=".5" width="494" height="194" rx="4.5" fill="none" stroke="#30363D"/>

  <!-- Title -->
  <text x="25" y="35" class="h">Mehmet Sezen&apos;s GitHub Stats</text>
  <line x1="25" y1="48" x2="360" y2="48" stroke="#30363D" stroke-width="1"/>

  <!-- Stars -->
  <rect x="25" y="63" width="5" height="15" rx="1" fill="#58A6FF"/>
  <text x="37" y="75" class="lb">Total Stars Earned:</text>
  <text x="230" y="75" class="vl">3</text>

  <!-- Commits -->
  <rect x="25" y="88" width="5" height="15" rx="1" fill="#58A6FF"/>
  <text x="37" y="100" class="lb">Total Commits:</text>
  <text x="230" y="100" class="vl">2000+</text>

  <!-- Pull Requests -->
  <rect x="25" y="113" width="5" height="15" rx="1" fill="#58A6FF"/>
  <text x="37" y="125" class="lb">Total PRs:</text>
  <text x="230" y="125" class="vl">48</text>

  <!-- Issues -->
  <rect x="25" y="138" width="5" height="15" rx="1" fill="#58A6FF"/>
  <text x="37" y="150" class="lb">Total Issues:</text>
  <text x="230" y="150" class="vl">27</text>

  <!-- Contributed to -->
  <rect x="25" y="163" width="5" height="15" rx="1" fill="#58A6FF"/>
  <text x="37" y="175" class="lb">Contributed to:</text>
  <text x="230" y="175" class="vl">50+ repos</text>

  <!-- Rank circle (center: 415, 97) -->
  <!-- Circumference = 2*pi*38 = 238.76                     -->
  <!-- SSS = full circle: dasharray="239 0"                 -->
  <!-- To change rank adjust first value:                   -->
  <!--   A++: 239 0 | A+: 224 15 | A: 196 43 | B+: 179 60  -->
  <!--   B:   155 84 | C: 120 119 | D: 72 167               -->
  <g transform="translate(415,97)">
    <circle r="38" fill="none" stroke="#21262D" stroke-width="6"/>
    <circle r="38" fill="none" stroke="#FFD700" stroke-width="6"
            stroke-dasharray="239 0" stroke-linecap="round"
            transform="rotate(-90)"/>
    <text y="-4"  text-anchor="middle" class="rk">SSS</text>
    <text y="14"  text-anchor="middle" class="rs">Rank</text>
  </g>
</svg>
